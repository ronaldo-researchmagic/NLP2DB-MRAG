version: '3'

services:
  mysql:
    image: mysql:latest
    container_name: db-gpt-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: db_faturamento
      MYSQL_USER: dbgpt
      MYSQL_PASSWORD: dbgpt123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

volumes:
  mysql_data:
